server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源必须命中真实文件（2026-11-03）。
  # 原来所有路径都 try_files → /index.html：一旦资源路径算错（例如 SPA 深链下
  # 相对路径被解析成 /history/assets/x.js），缺失的 js 会被 index.html 顶替，
  # 浏览器报「Expected a JavaScript module but got text/html」，整页白屏且难定位。
  # 这里让缺失资源直接 404，问题立刻暴露，也不会污染缓存。
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA 前端路由：其余路径都回落到 index.html（BrowserRouter 深链刷新）
  location / {
    try_files $uri $uri/ /index.html;
  }
}
